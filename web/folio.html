<title>Folio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<style>
/* Layout: an iOS-style journal. Glass controls float over a softly tinted grouped background; entry cards
   carry an attachment grid on top and the date in the footer; sheets rise from the bottom (partial sheets float),
   menus pop from their button, and on wide screens a glass sidebar holds the journals. */
:root{
  --grouped:#F2F2F7; --wash:#E8E0FB; --card:#FFFFFF; --cell:#FFFFFF; --sheet-g:#F2F2F7; --plain:#FFFFFF;
  --label:#000000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.17);
  --fill:rgba(120,120,128,.2); --fill-2:rgba(120,120,128,.16); --fill-3:rgba(118,118,128,.12); --fill-4:rgba(116,116,128,.08);
  --tint:#6448E0; --tint-fill:#7357F0; --tint-soft:rgba(115,87,240,.13); --on-tint:#FFFFFF;
  --red:#FF3B30; --green:#34C759; --orange:#FF9500;
  --glass:rgba(255,255,255,.68); --glass-in:rgba(255,255,255,.72); --glass-brd:rgba(0,0,0,.07); --glass-hi:rgba(255,255,255,.95);
  --glass-shadow:0 8px 24px rgba(30,20,70,.09),0 1px 4px rgba(0,0,0,.05);
  --menu:rgba(250,250,252,.88); --seg-on:#FFFFFF; --scrim:rgba(0,0,0,.22);
  --card-shadow:0 1px 1px rgba(0,0,0,.02),0 8px 22px -14px rgba(50,30,110,.22);
  --map-land:#F1EEE6; --map-road:#FFFFFF; --map-park:#CFE7C7; --map-water:#AED4F2; --map-pin:#FF3B30;
  --refl-a:#7A5CF0; --refl-b:#D9609E; --refl-c:#F49A54;
  --m0:#5A3FCF; --m1:#6C69E6; --m2:#6E9EF0; --m3:#5CC2D8; --m4:#9CCB5E; --m5:#F5BE3F; --m6:#F58A33;
  --j0:#7357F0; --j1:#007AFF; --j2:#34C759; --j3:#FF9500; --j4:#FF2D55; --j5:#30B0C7; --j6:#AF52DE; --j7:#8E8E93;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  --r-card:22px; --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --grouped:#000000; --wash:#1B1330; --card:#1C1C1E; --cell:#2C2C2E; --sheet-g:#1C1C1E; --plain:#1C1C1E;
    --label:#FFFFFF; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
    --fill:rgba(120,120,128,.36); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(118,118,128,.24); --fill-4:rgba(118,118,128,.18);
    --tint:#A995FF; --tint-fill:#7A60F5; --tint-soft:rgba(140,115,255,.22); --on-tint:#FFFFFF;
    --red:#FF453A; --green:#30D158; --orange:#FF9F0A;
    --glass:rgba(40,40,44,.6); --glass-in:rgba(72,72,78,.5); --glass-brd:rgba(255,255,255,.1); --glass-hi:rgba(255,255,255,.14);
    --glass-shadow:0 8px 28px rgba(0,0,0,.45),0 1px 4px rgba(0,0,0,.3);
    --menu:rgba(40,40,44,.9); --seg-on:#636366; --scrim:rgba(0,0,0,.5);
    --card-shadow:none;
    --map-land:#2B2D31; --map-road:#45484F; --map-park:#24382A; --map-water:#1F3A57; --map-pin:#FF453A;
    --refl-a:#6A4FE0; --refl-b:#C2508D; --refl-c:#E08648;
    --m0:#7558E8; --m1:#7F7CF2; --m2:#7EAAF5; --m3:#6CCDE0; --m4:#A8D56B; --m5:#F7C84E; --m6:#F79A47;
    --j0:#8D76FF; --j1:#0A84FF; --j2:#30D158; --j3:#FF9F0A; --j4:#FF375F; --j5:#40C8E0; --j6:#BF5AF2; --j7:#98989D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --grouped:#000000; --wash:#1B1330; --card:#1C1C1E; --cell:#2C2C2E; --sheet-g:#1C1C1E; --plain:#1C1C1E;
  --label:#FFFFFF; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
  --fill:rgba(120,120,128,.36); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(118,118,128,.24); --fill-4:rgba(118,118,128,.18);
  --tint:#A995FF; --tint-fill:#7A60F5; --tint-soft:rgba(140,115,255,.22); --on-tint:#FFFFFF;
  --red:#FF453A; --green:#30D158; --orange:#FF9F0A;
  --glass:rgba(40,40,44,.6); --glass-in:rgba(72,72,78,.5); --glass-brd:rgba(255,255,255,.1); --glass-hi:rgba(255,255,255,.14);
  --glass-shadow:0 8px 28px rgba(0,0,0,.45),0 1px 4px rgba(0,0,0,.3);
  --menu:rgba(40,40,44,.9); --seg-on:#636366; --scrim:rgba(0,0,0,.5);
  --card-shadow:none;
  --map-land:#2B2D31; --map-road:#45484F; --map-park:#24382A; --map-water:#1F3A57; --map-pin:#FF453A;
  --refl-a:#6A4FE0; --refl-b:#C2508D; --refl-c:#E08648;
  --m0:#7558E8; --m1:#7F7CF2; --m2:#7EAAF5; --m3:#6CCDE0; --m4:#A8D56B; --m5:#F7C84E; --m6:#F79A47;
  --j0:#8D76FF; --j1:#0A84FF; --j2:#30D158; --j3:#FF9F0A; --j4:#FF375F; --j5:#40C8E0; --j6:#BF5AF2; --j7:#98989D;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(130% 48% at 50% 0%,var(--wash) 0%,transparent 72%),var(--grouped);color:var(--label);font:17px/1.3 var(--f);letter-spacing:-.008em;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px}
::placeholder{color:var(--label-3);opacity:1}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
.ic.fill path{fill:currentColor}
.ic.chev{width:15px;height:15px;color:var(--label-3);stroke-width:2.6;margin-left:auto}
.ic.tchk{width:20px;height:20px;color:var(--tint);stroke-width:2.6}
mark{background:color-mix(in srgb,#FFCC00 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.cnt{color:var(--label-2);font-variant-numeric:tabular-nums;font-size:17px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-brd),inset 0 1px 1px var(--glass-hi),var(--glass-shadow)}

/* ---------- shell ---------- */
#app{display:flex;height:100%}
#side{display:none}
#stage{position:relative;flex:1;min-width:0;height:100%}
#scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:60px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 150px}
.nav{position:absolute;top:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:minmax(44px,1fr) minmax(0,auto) minmax(44px,1fr);align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.nav > *{pointer-events:auto;position:relative;z-index:1}
.nav > :first-child{justify-self:start}
.nav > :last-child{justify-self:end}
.nav::before{content:"";position:absolute;inset:0 0 -28px;background:color-mix(in srgb,var(--grouped) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent);opacity:0;transition:opacity .25s;pointer-events:none}
.nav.scrolled::before{opacity:1}
.nav-t{font-size:17px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.nav.scrolled .nav-t{opacity:1}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--label)}
.gcap{display:flex;align-items:center;height:44px;border-radius:22px;padding:0 4px}
.gcap button{width:40px;height:44px;display:grid;place-items:center;color:var(--label);border-radius:22px}
.gcap button.on .ic{background:var(--tint-fill);color:#fff;border-radius:50%;padding:5px;width:30px;height:30px;stroke-width:2.2}
.lt{padding:6px 2px 16px}
.lt h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.004em;overflow-wrap:anywhere}
.lt p{margin:2px 0 0;font-size:15px;color:var(--label-2);font-variant-numeric:tabular-nums}
.searchrow{display:flex;gap:12px;align-items:center;margin:0 0 14px}
.sfield{flex:1;display:flex;align-items:center;gap:7px;height:44px;padding:0 14px;border-radius:22px;background:var(--fill-3);color:var(--label-2);min-width:0}
.sfield .ic{width:18px;height:18px}
.sfield input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--label);font-size:17px}
.sfield input::-webkit-search-cancel-button{-webkit-appearance:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--fill-3);color:var(--label);font-size:15px;font-weight:500;white-space:nowrap;max-width:100%}
.chip .ic{width:16px;height:16px}
.chip.on{background:var(--tint-soft);color:var(--tint);font-weight:600}
.chip .cnt{font-size:15px}
#list{display:flex;flex-direction:column;gap:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:50px;padding:0 22px;border-radius:25px;font-size:17px;font-weight:600;white-space:nowrap}
.btn .ic{width:20px;height:20px;stroke-width:2.1}
.btn.sm{height:36px;padding:0 15px;border-radius:18px;font-size:15px}
.btn.sm .ic{width:17px;height:17px}
.btn.block{width:100%}
.btn.tint{background:var(--tint-fill);color:var(--on-tint)}
.btn.gray{background:var(--fill-3);color:var(--tint)}
.btn.plain{color:var(--tint);padding:0 6px}
.btn.red{background:var(--fill-3);color:var(--red)}
#fab{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;z-index:7;background:radial-gradient(120% 120% at 30% 15%,color-mix(in srgb,var(--tint-fill) 70%,#fff) 0%,var(--tint-fill) 55%);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -3px 8px rgba(0,0,0,.12),0 12px 28px -10px color-mix(in srgb,var(--tint-fill) 80%,transparent),0 2px 6px rgba(0,0,0,.12);transition:transform .25s var(--ease)}
#fab:active{transform:translateX(-50%) scale(.92)}
#fab .ic{width:30px;height:30px;stroke-width:2.6}
.edge-b{position:absolute;left:0;right:0;bottom:0;height:128px;pointer-events:none;z-index:5;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(to top,#000 22%,transparent);mask-image:linear-gradient(to top,#000 22%,transparent);background:linear-gradient(to top,color-mix(in srgb,var(--grouped) 70%,transparent),transparent)}

/* ---------- entry cards ---------- */
.e-card{background:var(--card);border-radius:var(--r-card);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--card-shadow);transition:transform .25s var(--ease);min-width:0}
.e-card:active{transform:scale(.985)}
.e-text{padding:12px 16px 0;display:flex;flex-direction:column;gap:3px;min-width:0}
.e-prompt{margin:0 0 3px;font-size:15px;font-weight:600;line-height:1.3;color:var(--tint);display:flex;gap:6px;align-items:flex-start}
.e-prompt .ic{width:17px;height:17px;margin-top:1px}
.e-title{margin:0;font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.e-body{margin:0;font-size:17px;line-height:1.36;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.e-foot{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 6px 6px 16px;font-size:13px;color:var(--label-2);min-width:0}
.e-date{font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.e-j{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.jdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--jc);flex:none}
.e-bm{color:var(--tint);display:inline-flex}
.e-bm .ic{width:16px;height:16px}
.e-more{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--label-2);flex:none}
.e-more .ic{width:20px;height:20px}

/* attachment grid */
.grid{position:relative;display:grid;gap:3px;border-radius:16px;overflow:hidden}
.e-card .grid{margin:6px 6px 0}
.g1{grid-template-columns:1fr}.g1 .tile{aspect-ratio:3/2;max-height:460px}.g1.short .tile{aspect-ratio:7/3;max-height:176px}
.g2{grid-template-columns:1fr 1fr}.g2 .tile{aspect-ratio:1/1}
.g3{grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:3/2}.g3 .tile{height:100%;min-height:0}.g3 .tile:first-child{grid-row:span 2}
.g4{grid-template-columns:1fr 1fr}.g4 .tile{aspect-ratio:4/3}
.gm{grid-template-columns:1fr 1fr}.gm .tile{aspect-ratio:1/1}.gm .tile:last-child:nth-child(odd){grid-column:span 2;aspect-ratio:2/1}
.grid .more{position:absolute;right:0;bottom:0;width:calc(50% - 1.5px);height:calc(50% - 1.5px);display:grid;place-items:center;background:rgba(0,0,0,.42);color:#fff;font-size:22px;font-weight:600;pointer-events:none}
.tile{position:relative;display:block;width:100%;max-width:100%;min-width:0;overflow:hidden;background:var(--fill-3);color:#fff;text-align:left;border:0;padding:0;font:inherit}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.tile img.in{opacity:1}
.tile .shade{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(transparent,rgba(0,0,0,.5));pointer-events:none}
.t-lab{position:absolute;left:12px;right:12px;bottom:10px;display:flex;flex-direction:column;gap:1px;font-size:13px;font-weight:500;line-height:1.22;z-index:1;min-width:0}
.t-lab > *{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-lab small{font-size:12px;font-weight:600;opacity:.82}
.t-lab b{font-size:17px;font-weight:700;line-height:1.2}
.tile.aud{background:linear-gradient(140deg,var(--refl-a),var(--refl-b))}
.t-ic{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;z-index:1}
.t-ic .ic{width:15px;height:15px}
.wv{position:absolute;left:14px;right:14px;top:22%;bottom:34%;display:flex;align-items:center;justify-content:space-between;gap:2px}
.wv i{flex:1;max-width:4px;height:var(--h);border-radius:2px;background:rgba(255,255,255,.5);transition:background .15s}
.wv i.p{background:#fff}
.tile.map{--a1:30deg;--a2:110deg;--a3:160deg;--a4:170deg;--px:70%;--py:30%;background:
  radial-gradient(circle at var(--px) var(--py),var(--map-park) 0 17%,transparent 17.5%),
  linear-gradient(var(--a1),transparent 47%,var(--map-road) 47% 51%,transparent 51%),
  linear-gradient(var(--a2),transparent 30%,var(--map-road) 30% 32.5%,transparent 32.5%),
  linear-gradient(var(--a3),transparent 64%,var(--map-road) 64% 66.5%,transparent 66.5%),
  linear-gradient(var(--a4),transparent 76%,var(--map-water) 76%),
  var(--map-land)}
.pin{position:absolute;left:50%;top:42%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--map-pin);box-shadow:0 0 0 3px #fff,0 4px 12px rgba(0,0,0,.3);z-index:1}
.pin::after{content:"";position:absolute;inset:8.5px;border-radius:50%;background:#fff}
.tile.mood{color:var(--mtx);background:radial-gradient(130% 120% at 85% 5%,color-mix(in srgb,var(--mc) 50%,#fff) 0%,var(--mc) 62%,color-mix(in srgb,var(--mc) 82%,#000) 100%)}
.tile.mood .blob{position:absolute;right:-6%;top:-12%;width:60%;max-width:160px;aspect-ratio:1;border-radius:var(--shape);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.78),rgba(255,255,255,.06) 72%)}
.rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;z-index:2}
.rm .ic{width:14px;height:14px;stroke-width:2.6}
.tile.playing .t-ic{background:#fff;color:var(--refl-a)}

/* reflection + banners + empty */
.rg0{--g1:var(--refl-a);--g2:var(--refl-b);--g3:var(--refl-c)}
.rg1{--g1:var(--m2);--g2:var(--refl-a);--g3:var(--refl-b)}
.rg2{--g1:var(--refl-c);--g2:var(--refl-b);--g3:var(--refl-a)}
.gcard{background:linear-gradient(135deg,var(--g1),var(--g2) 60%,var(--g3));color:#fff}
.refl{position:relative;border-radius:var(--r-card);padding:16px 18px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.refl .ey,.pcard .ey,.rcard .ey{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.82}
.refl .q{margin:0;font-size:22px;font-weight:700;line-height:1.22;text-wrap:balance;padding-right:30px}
.refl .row2{display:flex;gap:8px;flex-wrap:wrap}
.wbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:18px;background:rgba(255,255,255,.95);color:#3B2A8C;font-size:15px;font-weight:600}
.wbtn.ghost{background:rgba(255,255,255,.2);color:#fff}
.wbtn .ic{width:16px;height:16px}
.xbtn{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center}
.xbtn .ic{width:15px;height:15px;stroke-width:2.6}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 10px 10px 16px;border-radius:18px;background:var(--card);box-shadow:var(--card-shadow);font-size:15px}
.banner > .ic{width:20px;height:20px;color:var(--tint)}
.banner .bt{flex:1;min-width:12ch}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:60px 12px 0}
.empty.small{padding-top:36px}
.eico{width:88px;height:88px;border-radius:26px;display:grid;place-items:center;margin-bottom:8px;box-shadow:0 14px 30px -14px var(--refl-a)}
.eico .ic{width:46px;height:46px;stroke-width:1.6}
.empty h2{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.empty p{margin:0;color:var(--label-2);font-size:15px;max-width:34ch;line-height:1.38}
.empty .row2{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:12px}

/* ---------- sidebar (wide screens) ---------- */
@media (min-width:980px){
  #side{display:flex;flex-direction:column;gap:22px;width:290px;flex:none;margin:10px 0 10px max(10px,env(safe-area-inset-left,0px));border-radius:28px;padding:20px 12px 16px;overflow-y:auto}
  #nav-j{visibility:hidden}
  .side-h{font-size:28px;font-weight:700;padding:0 10px;margin:0}
  .side-sec{display:flex;flex-direction:column;gap:2px}
  .side-sec > span{font-size:15px;font-weight:600;color:var(--label-2);padding:0 10px 6px}
  .side-item{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 10px;border-radius:14px;font-size:17px;width:100%}
  .side-item:hover{background:var(--fill-4)}
  .side-item.cur{background:var(--tint-soft);color:var(--tint);font-weight:600}

class LocalStore {
  constructor() { this.kind = 'local'; this.mem = { meta: null, entries: new Map(), media: new Map() }; this.dbp = null; }
  open() {
    if (this.dbp) return this.dbp;
    this.dbp = new Promise(res => {
      try {
        const r = indexedDB.open('folio', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('entries', { keyPath: 'id' }); d.createObjectStore('media'); };
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch { res(null); }
      setTimeout(() => res(null), 3000);
    });
    return this.dbp;
  }
  req(d, store, mode, fn) {
    return new Promise((res, rej) => {
      try { const t = d.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }
      catch (e) { rej(e); }
    });
  }
  async init() {
    const d = await this.open();
    if (!d) return { meta: clone(this.mem.meta), entries: [...this.mem.entries.values()].map(clone) };

    const entries = await this.req(d, 'entries', 'readonly', s => s.getAll());
    return { meta: meta || null, entries: entries || [] };
  }
  async putMeta(m) { const d = await this.open(); if (!d) { this.mem.meta = clone(m); return; } await this.req(d, 'kv', 'readwrite', s => s.put(clone(m), 'meta')); }
  async putEntry(e) { const d = await this.open(); if (!d) { this.mem.entries.set(e.id, clone(e)); return; } await this.req(d, 'entries', 'readwrite', s => s.put(clone(e))); }
  async delEntry(id) { const d = await this.open(); if (!d) { this.mem.entries.delete(id); return; } await this.req(d, 'entries', 'readwrite', s => s.delete(id)); }
  async putMedia(id, url) { const d = await this.open(); if (!d) { this.mem.media.set(id, url); return 1; } await this.req(d, 'media', 'readwrite', s => s.put(url, id)); return 1; }
  async getMedia(id) { const d = await this.open(); if (!d) return this.mem.media.get(id) || null; return (await this.req(d, 'media', 'readonly', s => s.get(id))) || null; }
  async delMedia(id) { const d = await this.open(); if (!d) { this.mem.media.delete(id); return; } await this.req(d, 'media', 'readwrite', s => s.delete(id)); }
  async clearAll() {
    const d = await this.open(); if (!d) { this.mem.entries.clear(); this.mem.media.clear(); return; }
    await this.req(d, 'entries', 'readwrite', s => s.clear()); await this.req(d, 'media', 'readwrite', s => s.clear());
  }
}

class CloudStore {

}

  let cells = '';

    cells += `<button class="${o ? 'has' : ''}${k === today ? ' today' : ''}"${o ? ` data-act="cal-day" data-day="${k}"` : ' disabled'}${style} aria-label="${label}">${d}</button>`;

function moodChart(list) {
  const N = 30, end = new Date(); end.setHours(12, 0, 0, 0);

    const d = new Date(end); d.setDate(d.getDate() - i); const k = dayKey(d);
    const vs = list.filter(e => e.mood && dayKey(e.date) === k).map(e => e.mood.v);
    if (vs.length) pts.push({ i: N - 1 - i, v: vs.reduce((a, b) => a + b, 0) / vs.length });
  }

  const W = 340, H = 176, L = 74, R = 10, T = 12, B = 28, w = W - L - R, h = H - T - B;
  const X = i => L + i / (N - 1) * w, Y = v => T + (3 - v) / 6 * h;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="State of mind by day over the last 30 days">`;
  for (const [v, lab] of [[3, 'Pleasant'], [0, 'Neutral'], [-3, 'Unpleasant']]) s += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="lab" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${lab}</text>`;
  if (pts.length > 1) s += `<polyline class="trend" points="${pts.map(p => `${X(p.i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}"/>`;
  for (const p of pts) s += `<circle class="dot" cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="6" style="fill:var(--m${Math.round(p.v) + 3})"/>`;

  return s;
}

const dots = n => [0, 1, 2, 3].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
const keypadHTML = act => `<div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, 'del'].map(k => k === '' ? '<span></span>' : k === 'del' ? `<button class="kdel" data-act="${act}" data-k="del" aria-label="Delete digit">${ic('delkey')}</button>` : `<button data-act="${act}" data-k="${k}" aria-label="${k}"><span class="kd">${k}</span><span class="kl">${KEYLETTERS[k] || ''}</span></button>`).join('')}</div>`;
function pinFlow(mode) {

    PIN = { mode, step: mode === 'set' ? 'new' : 'verify', buf: '', first: null, err: '', res };
    openSheet('pin', { kind: 'full pl', label: 'Passcode', html: '<div id="pin-wrap" style="display:contents"></div>', onClose: () => { if (PIN) { const r = PIN.res; PIN = null; r(mode === 'verify' ? false : null); } } });

}
function drawPin() {
  const el = $('#pin-wrap'); if (!el || !PIN) return;
  const t = PIN.step === 'verify' ? 'Enter Passcode' : PIN.step === 'new' ? 'Choose a Passcode' : 'Re-enter Passcode';
  el.innerHTML = `${head(navX('close', 'Cancel'), 'Passcode')}
    <div class="sh-body pin-body"><h2 class="pin-t">${t}</h2><div class="pin-dots" id="pin-dots">${dots(PIN.buf.length)}</div><p class="pin-err">${esc(PIN.err)}</p>${keypadHTML('pin-key')}</div>`;

function finishPin(v) { const r = PIN.res; PIN = null; closeSheet('pin'); r(v); }
async function pinKey(k) {
  if (!PIN) return;
  if (k === 'del') PIN.buf = PIN.buf.slice(0, -1); else if (PIN.buf.length < 4) PIN.buf += k;
  PIN.err = '';
  if (PIN.buf.length < 4) { const d = $('#pin-dots'); if (d) d.innerHTML = dots(PIN.buf.length); return; }
  const code = PIN.buf; PIN.buf = '';
  if (PIN.step === 'verify') {
    if (await hashPin(code) !== S.meta.settings.pin) PIN.err = 'Wrong passcode. Try again.';
    else if (PIN.mode === 'change') PIN.step = 'new';
    else { finishPin(true); return; }
  } else if (PIN.step === 'new') { PIN.first = code; PIN.step = 'again'; }
  else if (code !== PIN.first) { PIN.err = 'Passcodes didn’t match. Try again.'; PIN.step = 'new'; PIN.first = null; }
  else { finishPin(await hashPin(code)); return; }

  if (PIN && PIN.err) { const d = $('#pin-dots'); if (d) d.classList.add('shake'); }
}

function toMarkdown(list) {
  const out = [`# ${scopeName()}`, '', `Exported from Folio on ${fmt(Date.now(), { day: 'numeric', month: 'long', year: 'numeric' })}`, ''];
  for (const e of list) {
    out.push(`## ${fmt(e.date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}, ${timeStr(e.date)}`, '');
    if (e.title) out.push(`### ${e.title}`, '');
    if (e.prompt) out.push(`> ${e.prompt}`, '');
    if (e.body) out.push(e.body, '');
    const meta = [];
    if (e.place) meta.push(`Location: ${e.place}`);
    if (e.mood) meta.push(`${e.mood.kind === 'day' ? 'Mood' : 'Emotion'}: ${VAL[e.mood.v + 3]}${e.mood.feelings.length ? ` (${e.mood.feelings.join(', ')})` : ''}`);
    if ((e.media || []).length) meta.push(`${e.media.length} ${plural(e.media.length, 'attachment')} not included`);
    if (e.bookmarked) meta.push('Bookmarked');
    if (meta.length) out.push(`*${meta.join(' · ')}*`, '');
  }
  return out.join('\n');
}

async function importJSON(file) {

  if (!o || o.app !== 'folio' || !Array.isArray(o.entries)) { toast('That file isn’t a Folio backup.'); return; }
  const have = new Set(S.entries.map(e => e.id));
  const todo = o.entries.filter(e => e && okId(e.id) && !have.has(e.id));
  let metaChanged = false;
  for (const j of o.journals || []) if (j && okId(j.id) && !jById(j.id)) { S.meta.journals.push({ id: j.id, name: String(j.name || 'Journal').slice(0, 40), color: (+j.color || 0) % 8, created: +j.created || Date.now(), ...(j.examples ? { examples: true } : {}) }); metaChanged = true; }
  if (metaChanged) await saveMeta();
  if (!todo.length) { renderAll(); toast('Everything in that backup is already here.'); return; }
  let done = 0;
  toast(`Restoring ${todo.length} ${plural(todo.length, 'entry', 'entries')}…`, 4000);
  try {
    for (const raw of todo) {
      const e = sanitizeEntry(raw);
      if (!jById(e.journalId)) e.journalId = defaultJournalId();
      for (const m of e.media) {
        const full = o.media && o.media[m.id], th = o.media && o.media[m.id + '-t'];
        if (typeof full === 'string') { m.n = await S.store.putMedia(m.id, full); primeMedia(m.id, full); }
        if (typeof th === 'string') { m.tn = await S.store.putMedia(m.id + '-t', th); primeMedia(m.id + '-t', th); }
      }
      await S.store.putEntry(e); upsertLocal(e); done++;

  } catch (err) { toast(errMsg(err), 4000); }

  if (done) toast(`Restored ${done} ${plural(done, 'entry', 'entries')}`);
}
function paintScene(kind) {
